# Local ClickHouse for development. Everything here is dev-only and driven by .env,
# which is gitignored — no credentials are ever committed.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: reel-query-ch
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-reel_query}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-reel}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required - run "make env" to generate .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER:-reel}", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clickhouse_data:
